<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f766e">
    <title>Mess Manager Offline</title>
    <style>
        :root {
            color-scheme: light;
            font-family: system-ui, sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            margin: 0;
            padding: 24px;
        }

        main {
            max-width: 420px;
            text-align: center;
            padding: 32px;
            border-radius: 24px;
            background: white;
            box-shadow: 0 16px 40px rgb(15 23 42 / 10%);
        }

        img {
            width: 72px;
            height: 72px;
            margin-bottom: 16px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        p {
            margin: 0;
            color: #64748b;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <main>
        <img src="/icons/mess-manager.svg" alt="Mess Manager">
        <h1>You are offline</h1>
        <p>Reconnect to the internet and try again. Your Mess Manager app is ready when the connection returns.</p>
    </main>
</body>

</html>
